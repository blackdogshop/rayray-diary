<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>瑞瑞的成長日記</title>
<style>
  :root{
    --milk:#FBF7EF;
    --tabby:#5A4A3A;
    --tabby-soft:#6F5F4C;
    --stripe:#EDE4D6;
    --butter:#F5C84C;
    --butter-deep:#E0A93E;
    --paw:#E8927C;
    --leaf:#7FA37A;
    --card:#FFFFFF;
    --shadow:0 2px 10px rgba(90,74,58,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
    background:var(--milk);color:var(--tabby);
    min-height:100vh;padding-bottom:110px;
  }
  .wrap{max-width:520px;margin:0 auto;padding:16px}

  header{display:flex;align-items:center;gap:12px;padding:8px 4px 16px}
  header .avatar{
    width:52px;height:52px;border-radius:50%;flex-shrink:0;
    background:#F5E9D8;border:2.5px solid var(--butter);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    cursor:pointer;position:relative;
  }
  header .avatar::after{
    content:'📷';position:absolute;right:-2px;bottom:-2px;
    font-size:11px;background:#fff;border-radius:50%;
    width:18px;height:18px;display:flex;align-items:center;justify-content:center;
    box-shadow:0 1px 3px rgba(0,0,0,.2);
  }
  header .avatar svg{width:100%;height:100%}
  header .head-text h1{font-size:22px;font-weight:800;letter-spacing:1px;line-height:1.25}
  header .head-text .age{font-size:12px;color:var(--tabby-soft);margin-top:2px}

  .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
  .stat{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:12px 8px;text-align:center}
  .stat .val{font-size:20px;font-weight:800;line-height:1.2}
  .stat .lbl{font-size:11px;color:var(--tabby-soft);margin-top:3px}
  .stat.alert .val{color:var(--paw)}
  .stat.ok .val{color:var(--leaf)}
  .stat .sub2{font-size:10px;color:var(--leaf);font-weight:700;margin-top:2px;line-height:1.1}
  .range-toggle{display:flex;gap:6px;margin:0 0 10px}
  .range-toggle button{
    padding:5px 12px;border-radius:99px;border:1.5px solid var(--stripe);
    background:#fff;font-size:11px;font-weight:700;color:var(--tabby-soft);
    cursor:pointer;font-family:inherit;
  }
  .range-toggle button.sel{background:var(--butter);border-color:var(--butter);color:var(--tabby)}
  .chart-wrap{position:relative}
  .chart-tip{
    position:absolute;display:none;pointer-events:none;z-index:5;
    background:var(--tabby);color:#fff;font-size:11px;font-weight:700;
    padding:5px 9px;border-radius:8px;white-space:nowrap;line-height:1.35;text-align:center;
    box-shadow:0 2px 8px rgba(90,74,58,.25);
  }

  .card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
  .card h2{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
  .card h2 .sub{font-size:11px;font-weight:400;color:var(--tabby-soft)}
  canvas{width:100%;display:block}
  #weightChart{height:150px}
  #milkChart{height:140px}
  #foodChart{height:140px}

  .day-group{margin-bottom:6px}
  .day-head{font-size:12px;font-weight:700;color:var(--tabby-soft);padding:10px 4px 6px;display:flex;justify-content:space-between}
  .entry{
    background:var(--card);border-radius:12px;box-shadow:var(--shadow);
    padding:11px 12px;margin-bottom:8px;
    display:flex;align-items:flex-start;gap:10px;cursor:pointer;
    transition:transform .1s;
  }
  .entry:active{transform:scale(.985)}
  .entry .time{font-size:14px;font-weight:700;min-width:46px;padding-top:1px}
  .entry .mid{flex:1;min-width:0}
  .entry .main-line{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
  .entry .ml{font-size:15px;font-weight:700}
  .entry .ml small,.entry .gw small{font-size:11px;font-weight:400;color:var(--tabby-soft)}
  .entry .gw{font-size:13px;font-weight:700;color:var(--butter-deep)}
  .entry .flags{font-size:11px;color:var(--tabby-soft);margin-top:3px;display:flex;flex-wrap:wrap;gap:8px}
  .entry .flags .yes{color:var(--leaf);font-weight:600}
  .entry .flags .poop{color:var(--butter-deep);font-weight:700}
  .entry .flags .med{color:#7B87B8;font-weight:600;background:#EEF1F9;padding:1px 7px;border-radius:99px}
  .entry .flags .topical{color:#6D9B8A;font-weight:600;background:#E8F2EE;padding:1px 7px;border-radius:99px}
  .entry .flags .wound{color:#C97F6D;font-weight:600;background:#FAEBE7;padding:1px 7px;border-radius:99px}
  .entry .flags .vaccine{color:#A96A2E;font-weight:600;background:#F7EBDD;padding:1px 7px;border-radius:99px}
  .entry .note{font-size:11px;color:var(--tabby-soft);margin-top:3px;word-break:break-all;line-height:1.5}
  .entry .who{font-size:11px;padding:3px 8px;border-radius:99px;white-space:nowrap;background:var(--stripe);color:var(--tabby-soft);font-weight:600;margin-top:1px}
  .entry .who.mama{background:#F9E3DC;color:#C46A52}
  .entry .who.baba{background:#E3EDE2;color:#5B8256}
  .entry .who.naima{background:#EAE4F2;color:#7B6A99}
  .empty{text-align:center;color:var(--tabby-soft);font-size:13px;padding:30px 0}
  .hint{text-align:center;font-size:11px;color:#8A7C68;margin-top:4px;margin-bottom:8px}

  .fab{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--tabby);color:#fff;border:none;border-radius:99px;
    padding:14px 30px;font-size:15px;font-weight:700;font-family:inherit;
    box-shadow:0 6px 18px rgba(90,74,58,.3);cursor:pointer;z-index:20;letter-spacing:1px;
  }
  .overlay{position:fixed;inset:0;background:rgba(60,48,38,.45);z-index:30;display:none}
  .overlay.show{display:block}
  .sheet{
    position:fixed;left:0;right:0;bottom:-110%;z-index:40;
    background:var(--milk);border-radius:22px 22px 0 0;
    padding:20px 18px 34px;max-width:520px;margin:0 auto;
    transition:bottom .25s ease;max-height:90vh;overflow-y:auto;
  }
  .sheet.show{bottom:0}
  .sheet h3{font-size:17px;font-weight:800;margin-bottom:4px}
  .sheet .sheet-sub{font-size:11px;color:var(--tabby-soft);margin-bottom:14px}
  .field{margin-bottom:13px}
  .field label{font-size:12px;font-weight:700;color:var(--tabby-soft);display:block;margin-bottom:5px}
  .field input[type=text],.field input[type=number],.field input[type=datetime-local],.field textarea{
    width:100%;padding:11px 12px;border:1.5px solid var(--stripe);border-radius:11px;
    font-size:15px;font-family:inherit;background:#fff;color:var(--tabby);
  }
  .field textarea{resize:vertical;min-height:56px;line-height:1.5}
  .field input:focus,.field textarea:focus{outline:2px solid var(--butter);border-color:transparent}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .seg{display:flex;flex-wrap:wrap;gap:8px}
  .seg button{
    flex:1 1 calc(50% - 4px);min-width:64px;padding:10px 0;border-radius:11px;border:1.5px solid var(--stripe);
    background:#fff;font-size:13px;font-weight:600;color:var(--tabby-soft);
    cursor:pointer;font-family:inherit;
  }
  .seg button.sel{background:var(--tabby);color:#fff;border-color:var(--tabby)}
  .seg button.sel.pink{background:var(--paw);border-color:var(--paw)}
  .seg button.sel.green{background:var(--leaf);border-color:var(--leaf)}
  .seg button.sel.yellow{background:var(--butter);border-color:var(--butter);color:var(--tabby)}
  .sheet .save{
    width:100%;padding:14px 0;border:none;border-radius:13px;
    background:var(--tabby);color:#fff;font-size:16px;font-weight:800;
    font-family:inherit;cursor:pointer;margin-top:6px;letter-spacing:2px;
  }
  .sheet .save:disabled{opacity:.5}
  .sheet .danger{
    width:100%;padding:11px 0;border:none;border-radius:13px;background:none;
    color:var(--paw);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;margin-top:8px;
  }
  .sheet .cancel{
    width:100%;padding:10px 0;border:none;background:none;
    color:var(--tabby-soft);font-size:13px;font-family:inherit;cursor:pointer;margin-top:2px;
  }
  .toast{
    position:fixed;top:18px;left:50%;transform:translateX(-50%);
    background:var(--tabby);color:#fff;padding:10px 20px;border-radius:99px;
    font-size:13px;z-index:60;opacity:0;transition:opacity .3s;pointer-events:none;
    max-width:88%;text-align:center;
  }
  .toast.show{opacity:1}
  .syncnote{text-align:center;font-size:11px;color:#8A7C68;margin-top:6px}
  .syncnote.live{color:var(--leaf);font-weight:600}

  /* ---------- 相簿 ---------- */
  .photo-grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;
  }
  .photo-grid img{
    width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;
    cursor:pointer;display:block;background:var(--stripe);
  }
  .photo-add{
    display:block;text-align:center;padding:11px 0;border-radius:11px;
    border:1.5px dashed var(--butter-deep);color:var(--butter-deep);
    font-size:13px;font-weight:700;cursor:pointer;
  }
  .photo-add.busy{opacity:.5;pointer-events:none}
  .lightbox{
    position:fixed;inset:0;background:rgba(30,24,18,.92);z-index:70;
    display:none;flex-direction:column;align-items:center;justify-content:center;
    padding:20px;
  }
  .lightbox.show{display:flex}
  .lightbox img{max-width:100%;max-height:72vh;border-radius:12px}
  .lightbox .lb-meta{color:#EDE4D6;font-size:12px;margin-top:12px;text-align:center}
  .lightbox .lb-actions{display:flex;gap:14px;margin-top:14px}
  .lightbox button{
    border:none;border-radius:99px;padding:10px 22px;font-size:13px;font-weight:700;
    font-family:inherit;cursor:pointer;
  }
  .lightbox .lb-close{background:#EDE4D6;color:#5A4A3A}
  .lightbox .lb-del{background:#E8927C;color:#fff}
  .lb-nav{
    position:absolute;top:50%;transform:translateY(-50%);
    background:rgba(237,228,214,.25);color:#EDE4D6;
    border:none;border-radius:50%;width:40px;height:40px;
    font-size:26px;line-height:1;cursor:pointer;z-index:2;
    display:flex;align-items:center;justify-content:center;padding-bottom:4px;
  }
  .lb-prev{left:8px}
  .lb-next{right:8px}
  .photo-section-head{
    font-size:12px;font-weight:800;color:var(--butter-deep);
    margin:10px 0 7px;display:flex;align-items:center;gap:6px;
  }
  .photo-section-head::after{
    content:'';flex:1;height:1px;background:var(--stripe);
  }
  .photo-more{
    display:block;width:100%;text-align:center;padding:9px 0;margin-bottom:12px;
    border:none;border-radius:11px;background:var(--stripe);
    color:var(--tabby-soft);font-size:12px;font-weight:700;
    font-family:inherit;cursor:pointer;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="avatar" id="avatarBox" title="點擊更換頭像">
      <img id="avatarImg" src="avatar.jpg" alt="瑞瑞"
        style="width:100%;height:100%;object-fit:cover;display:block"
        onerror="this.style.display='none';document.getElementById('avatarFallback').style.display='block'">
      <svg id="avatarFallback" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" style="display:none">
        <!-- 耳朵 -->
        <polygon points="14,26 19,8 30,20" fill="#8A7358"/>
        <polygon points="50,26 45,8 34,20" fill="#8A7358"/>
        <polygon points="17,23 20,12 27,20" fill="#E8A88F"/>
        <polygon points="47,23 44,12 37,20" fill="#E8A88F"/>
        <!-- 臉 -->
        <circle cx="32" cy="37" r="21" fill="#A98F6E"/>
        <!-- 虎斑紋 -->
        <path d="M32 16 L32 24" stroke="#6E5A42" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M26 17.5 L27.5 24.5" stroke="#6E5A42" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M38 17.5 L36.5 24.5" stroke="#6E5A42" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M12.5 33 L18 34.5" stroke="#6E5A42" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M51.5 33 L46 34.5" stroke="#6E5A42" stroke-width="2.2" stroke-linecap="round"/>
        <!-- 眼睛 -->
        <circle cx="24.5" cy="36" r="3.4" fill="#3E3226"/>
        <circle cx="39.5" cy="36" r="3.4" fill="#3E3226"/>
        <circle cx="25.6" cy="34.8" r="1.1" fill="#fff"/>
        <circle cx="40.6" cy="34.8" r="1.1" fill="#fff"/>
        <!-- 鼻子和嘴 -->
        <polygon points="32,42 29.6,44.4 34.4,44.4" fill="#E8927C"/>
        <path d="M32 44.4 L32 47 M32 47 Q29 49.5 26.5 47.5 M32 47 Q35 49.5 37.5 47.5" stroke="#6E5A42" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        <!-- 鬍鬚 -->
        <path d="M18 42 L10 41 M18 45 L10.5 46" stroke="#6E5A42" stroke-width="1.2" stroke-linecap="round"/>
        <path d="M46 42 L54 41 M46 45 L53.5 46" stroke="#6E5A42" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="head-text">
      <h1>瑞瑞的成長日記</h1>
      <div class="age" id="ageLine">計算中…</div>
    </div>
  </header>
  <input type="file" id="avatarInput" accept="image/*" hidden>

  <div class="stats">
    <div class="stat ok">
      <div class="val" id="statWeight">–</div>
      <div class="lbl">最新體重</div>
    </div>
    <div class="stat">
      <div class="val" id="statMilk">–</div>
      <div class="lbl">今日奶量</div>
      <div class="sub2" id="statMilkFood"></div>
    </div>
    <div class="stat" id="statPoopCard">
      <div class="val" id="statPoop">–</div>
      <div class="lbl">距上次便便</div>
    </div>
  </div>

  <div id="medBanner" style="display:none;background:#EEF1F9;border-radius:12px;padding:9px 14px;margin-bottom:10px;font-size:13px;font-weight:700;color:#7B87B8;text-align:center"></div>
  <div id="daySummary" style="font-size:11.5px;color:var(--tabby-soft);text-align:center;margin:-4px 0 12px"></div>

  <div class="card">
    <h2>體重趨勢 <span class="sub">g・尿尿後餵奶前</span></h2>
    <div class="range-toggle" id="wRange">
      <button data-d="7" class="sel">最近7天</button>
      <button data-d="14">14天</button>
      <button data-d="0">全部</button>
    </div>
    <div class="chart-wrap">
      <canvas id="weightChart"></canvas>
      <div class="chart-tip" id="wTip"></div>
    </div>
  </div>

  <div class="card">
    <h2>每日奶量 <span class="sub">mL・當日合計</span></h2>
    <canvas id="milkChart"></canvas>
  </div>

  <div class="card" id="foodCard" style="display:none">
    <h2>每日罐罐 <span class="sub">g・當日合計</span></h2>
    <canvas id="foodChart"></canvas>
  </div>

  <div class="card" id="medCard" style="display:none">
    <h2>🩹 醫療 / 傷口紀錄 <span class="sub" id="medCount"></span></h2>
    <div id="medList"></div>
  </div>

  <div class="card">
    <h2>📷 瑞瑞相簿 <span class="sub" id="photoCount"></span></h2>
    <div class="photo-grid" id="photoGrid"><div class="empty" style="grid-column:1/-1;padding:14px 0">還沒有照片</div></div>
    <label class="photo-add">
      ＋ 上傳照片
      <input type="file" id="photoInput" accept="image/*" multiple hidden>
    </label>
  </div>

  <div class="hint">點任一筆記錄可以編輯或刪除</div>
  <div id="listArea"><div class="empty">連線中…</div></div>
  <div class="syncnote" id="syncNote">連線中…</div>
</div>

<button class="fab" id="fabBtn">＋ 新增記錄</button>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet">
  <h3 id="sheetTitle">新增記錄</h3>
  <div class="sheet-sub">奶量、罐罐、體重、便便、傷口都可以在同一筆一起填，沒有的留空就好</div>

  <div class="field">
    <label>時間</label>
    <input type="datetime-local" id="fTime">
  </div>

  <div class="two-col">
    <div class="field">
      <label>🍼 奶量 (mL)</label>
      <input type="number" id="fMl" inputmode="decimal" step="0.5" min="0" placeholder="沒餵留空">
    </div>
    <div class="field">
      <label>⚖️ 體重 (g)</label>
      <input type="number" id="fG" inputmode="decimal" step="0.5" min="0" placeholder="沒量留空">
    </div>
  </div>

  <div class="field">
    <label>🥫 離乳罐頭 (g)</label>
    <input type="number" id="fFood" inputmode="decimal" step="0.5" min="0" placeholder="沒吃留空">
  </div>

  <div class="field">
    <label>💧 尿尿</label>
    <div class="seg" id="peeSeg">
      <button data-v="self">自己尿</button>
      <button data-v="yes">有</button>
      <button data-v="no">沒有</button>
      <button data-v="na">未確認</button>
    </div>
  </div>

  <div class="field">
    <label>💛 便便</label>
    <div class="seg" id="poopSeg">
      <button data-v="no">沒有</button>
      <button data-v="yes">有</button>
    </div>
  </div>

  <div class="field">
    <label>🏥 醫療（有做才填，會顯示有填的項目）</label>
    <div style="background:#fff;border:1.5px solid var(--stripe);border-radius:11px;padding:10px 12px">
      <div style="margin-bottom:9px">
        <label style="font-size:11px;margin-bottom:4px">💊 吃藥</label>
        <input type="text" id="fMed" placeholder="例如：抗生素 0.2ml" style="border:1px solid var(--stripe)">
      </div>
      <div style="margin-bottom:9px">
        <label style="font-size:11px;margin-bottom:4px">🧴 擦藥</label>
        <input type="text" id="fTopical" placeholder="例如：傷口藥膏（目前暫緩）" style="border:1px solid var(--stripe)">
      </div>
      <div style="margin-bottom:9px">
        <label style="font-size:11px;margin-bottom:4px">🩹 傷口觀察</label>
        <input type="text" id="fWound" placeholder="例如：痂皮翹起、滲組織液…" style="border:1px solid var(--stripe)">
      </div>
      <div>
        <label style="font-size:11px;margin-bottom:4px">💉 預防針 / 其他醫療</label>
        <input type="text" id="fVaccine" placeholder="例如：第一劑三合一、驅蟲、下次回診 9/5" style="border:1px solid var(--stripe)">
      </div>
    </div>
  </div>

  <div class="field">
    <label>記錄人</label>
    <div class="seg" id="whoSeg">
      <button data-v="媽媽">媽媽</button>
      <button data-v="拔拔">拔拔</button>
    </div>
  </div>

  <div class="field">
    <label>備註（可空白）</label>
    <textarea id="fNote" placeholder="例如：餓醒的、叫醒才喝、喝完難入睡…"></textarea>
  </div>

  <button class="save" id="saveBtn">儲存</button>
  <button class="danger" id="deleteBtn" style="display:none">刪除這筆記錄</button>
  <button class="cancel" id="cancelBtn">取消</button>
</div>

<div class="toast" id="toast"></div>

<div class="lightbox" id="lightbox">
  <button class="lb-nav lb-prev" id="lbPrev">‹</button>
  <img id="lbImg" alt="瑞瑞照片">
  <button class="lb-nav lb-next" id="lbNext">›</button>
  <div class="lb-meta" id="lbMeta"></div>
  <div class="lb-actions">
    <button class="lb-close" id="lbClose">關閉</button>
    <button class="lb-del" id="lbDel">刪除照片</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, doc, setDoc, deleteDoc, getDoc,
  onSnapshot, writeBatch
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ================= Firebase ================= */

  authDomain: "rayray-dairy.firebaseapp.com",
  projectId: "rayray-dairy",

async function seedIfEmpty(){
  const marker = doc(db, 'meta', 'seeded');
  try{
    const m = await getDoc(marker);
    if(m.exists())return;
    const batch = writeBatch(db);
    SEED.forEach((s,i)=>{
      const ref = doc(db, COL, 'seed'+String(i).padStart(3,'0'));
      batch.set(ref, {
        t:s[0], ml:s[1], g:s[2], pee:s[3], poop:s[4],
        wound:s[5]||'', note:s[6]||'', who:s[7]
      });
    });
    batch.set(marker,{at:new Date().toISOString()});
    await batch.commit();
    toast('已匯入歷史記錄 🐾');
  }catch(e){
    console.error('seed error',e);
    toast('連線失敗：'+(e.message||'請檢查網路'));
  }
}

function startListening(){

      note.textContent='🟢 即時同步中：媽媽和拔拔的記錄會立即互相更新';

/* ================= 體重折線圖 ================= */
let weightRange=7; /* 顯示天數，0=全部 */
let weightPoints=[]; /* 目前繪製的資料點螢幕座標，供 hover 提示用 */
function renderWeightChart(){
  const cv=document.getElementById('weightChart');
  const dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth,H=150;
  cv.width=W*dpr;cv.height=H*dpr;
  const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);

  let ws=entries.filter(e=>e.g!=null).sort((a,b)=>a.t.localeCompare(b.t));
  /* 依選取的時間範圍過濾；若範圍內不足兩筆則退回全部，避免空圖 */
  if(weightRange>0){
    const cutoff=Date.now()-weightRange*864e5;
    const f=ws.filter(w=>new Date(w.t).getTime()>=cutoff);
    if(f.length>=2)ws=f;
  }
  if(ws.length<2){ctx.fillStyle='#8A7C68';ctx.font='12px sans-serif';ctx.fillText('至少要兩筆體重才能畫圖',16,70);return}
  const xs=ws.map(w=>new Date(w.t).getTime());
  const ys=ws.map(w=>w.g);
  const x0=Math.min(...xs),x1=Math.max(...xs);
  const y0=Math.min(...ys)-8,y1=Math.max(...ys)+8;
  const px=t=>18+(t-x0)/((x1-x0)||1)*(W-36);
  const py=g=>H-24-(g-y0)/((y1-y0)||1)*(H-44);

  ctx.strokeStyle='#F0E9DD';ctx.lineWidth=1;
  for(let i=0;i<4;i++){
    const y=14+i*(H-38)/3;
    ctx.beginPath();ctx.moveTo(14,y);ctx.lineTo(W-14,y);ctx.stroke();
  }
  ctx.beginPath();
  ws.forEach((w,i)=>{const x=px(xs[i]),y=py(ys[i]);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});
  ctx.lineTo(px(xs[xs.length-1]),H-20);ctx.lineTo(px(xs[0]),H-20);ctx.closePath();
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'rgba(245,200,76,.35)');grad.addColorStop(1,'rgba(245,200,76,0)');
  ctx.fillStyle=grad;ctx.fill();
  ctx.beginPath();
  ws.forEach((w,i)=>{const x=px(xs[i]),y=py(ys[i]);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});
  ctx.strokeStyle='#E0A93E';ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.stroke();
  weightPoints=[];
  ws.forEach((w,i)=>{
    ctx.beginPath();ctx.arc(px(xs[i]),py(ys[i]),3,0,7);
    ctx.fillStyle='#fff';ctx.fill();
    ctx.strokeStyle='#E0A93E';ctx.lineWidth=2;ctx.stroke();
    weightPoints.push({x:px(xs[i]),y:py(ys[i]),g:ys[i],t:w.t});
  });
  ctx.fillStyle='#8A7A68';ctx.font='11px sans-serif';ctx.textAlign='left';
  ctx.fillText(ys[0]+'g',px(xs[0])-6,py(ys[0])-8);
  ctx.textAlign='right';
  ctx.fillStyle='#5A4A3A';ctx.font='bold 12px sans-serif';
  ctx.fillText(ys[ys.length-1]+'g',Math.min(px(xs[xs.length-1])+6,W-4),py(ys[ys.length-1])-8);
  ctx.fillStyle='#8A7C68';ctx.font='10px sans-serif';
  ctx.textAlign='left';ctx.fillText(fmtDay(new Date(xs[0])),16,H-6);
  ctx.textAlign='right';ctx.fillText(fmtDay(new Date(xs[xs.length-1])),W-16,H-6);
}

/* ================= 每日奶量長條圖 ================= */
function renderMilkChart(){
  const cv=document.getElementById('milkChart');
  const dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth,H=140;
  cv.width=W*dpr;cv.height=H*dpr;
  const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);

  const daily={};
  entries.forEach(e=>{
    if(!e.ml)return;
    const d=e.t.slice(0,10);
    daily[d]=(daily[d]||0)+(+e.ml||0);
  });
  const days=Object.keys(daily).sort();
  if(!days.length){ctx.fillStyle='#8A7C68';ctx.font='12px sans-serif';ctx.fillText('還沒有奶量記錄',16,70);return}
  const shown=days.slice(-8);
  const max=Math.max(...shown.map(d=>daily[d]),10);
  const gap=(W-32)/shown.length;
  const barW=Math.min(36,gap-10);

  shown.forEach((d,i)=>{
    const v=Math.round(daily[d]*10)/10;
    const h=(v/max)*(H-48);
    const x=16+gap*i+(gap-barW)/2;
    const y=H-26-h;
    ctx.fillStyle= d===days[days.length-1] ? '#E0A93E' : '#F5C84C';
    roundRect(ctx,x,y,barW,h,6);
    ctx.fill();
    ctx.fillStyle='#5A4A3A';ctx.font='bold 11px sans-serif';ctx.textAlign='center';
    ctx.fillText(v,x+barW/2,y-5);
    ctx.fillStyle='#8A7C68';ctx.font='10px sans-serif';
    const dd=new Date(d+'T00:00');
    ctx.fillText(fmtDay(dd),x+barW/2,H-8);
  });
}
function roundRect(ctx,x,y,w,h,r){
  r=Math.min(r,h/2,w/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,0);
  ctx.arcTo(x,y+h,x,y,0);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

/* 單筆記錄的 DOM，清單與醫療區共用 */
function makeEntryEl(it){
  const e=document.createElement('div');
  e.className='entry';
  const dt=new Date(it.t);
  const parts=[];
  if(it.ml)parts.push(`<span class="ml">${it.ml} <small>mL</small></span>`);
  if(it.food)parts.push(`<span class="ml" style="color:var(--leaf)">🥫 ${it.food}<small>g</small></span>`);
  if(it.g!=null)parts.push(`<span class="gw">⚖️ ${it.g}<small>g</small></span>`);
  if(!parts.length)parts.push('<span class="ml"><small>觀察記錄</small></span>');
  const flags=[];
  if(it.pee==='yes')flags.push('<span class="yes">尿✓</span>');
  else if(it.pee==='self')flags.push('<span class="yes">自己尿✓</span>');
  else if(it.pee==='no')flags.push('尿–');
  if(it.poop==='yes')flags.push('<span class="poop">便💛</span>');
  if(it.med)flags.push(`<span class="med">💊 ${esc(it.med)}</span>`);
  if(it.topical)flags.push(`<span class="topical">🧴 ${esc(it.topical)}</span>`);
  if(it.wound)flags.push(`<span class="wound">🩹 ${esc(it.wound)}</span>`);
  if(it.vaccine)flags.push(`<span class="vaccine">💉 ${esc(it.vaccine)}</span>`);
  e.innerHTML=`
    <div class="time">${fmtTime(dt)}</div>
    <div class="mid">
      <div class="main-line">${parts.join('')}</div>
      ${flags.length?`<div class="flags">${flags.join(' ')}</div>`:''}
      ${it.note?`<div class="note">${esc(it.note)}</div>`:''}
    </div>
    <span class="who ${it.who==='媽媽'?'mama':it.who==='拔拔'?'baba':'naima'}">${esc(it.who)}</span>`;
  e.onclick=()=>openSheet(it.id);
  return e;
}

let listExpanded=false;
const LIST_DAYS=4; /* 收合時預設顯示最近幾天 */
function renderList(){
  const area=document.getElementById('listArea');
  area.innerHTML='';
  const items=[...entries].sort((a,b)=>b.t.localeCompare(a.t));
  if(!items.length){area.innerHTML='<div class="empty">還沒有記錄，按下方按鈕新增 🐾</div>';return}

  const groups={};
  items.forEach(it=>{
    const d=it.t.slice(0,10);
    (groups[d]=groups[d]||[]).push(it);
  });
  const allDays=Object.keys(groups).sort((a,b)=>b.localeCompare(a));
  const collapsed=!listExpanded&&allDays.length>LIST_DAYS;
  const days=collapsed?allDays.slice(0,LIST_DAYS):allDays;

  days.forEach(day=>{
    const g=document.createElement('div');g.className='day-group';
    const d=new Date(day+'T00:00');
    const tot=Math.round(groups[day].reduce((s,e)=>s+(+e.ml||0),0)*10)/10;
    const totFood=Math.round(groups[day].reduce((s,e)=>s+(+e.food||0),0)*10)/10;
    const totTxt=`奶量合計 ${tot} ml`+(totFood>0?`・罐罐 ${totFood} g`:'');
    g.innerHTML=`<div class="day-head"><span>${fmtDay(d)} (${'日一二三四五六'[d.getDay()]})</span><span>${totTxt}</span></div>`;
    groups[day].forEach(it=>g.appendChild(makeEntryEl(it)));
    area.appendChild(g);
  });

  if(allDays.length>LIST_DAYS){
    const btn=document.createElement('button');
    btn.className='photo-more';
    btn.textContent=collapsed
      ?`查看全部 ${allDays.length} 天記錄 ▾`
      :'收合記錄 ▴';
    btn.onclick=()=>{listExpanded=!listExpanded;renderList()};
    area.appendChild(btn);
  }
}

      b.classList.add('sel');
      if(colorMap&&colorMap[val])b.classList.add(colorMap[val]);
    }
  });
}
function getSeg(id){
  const b=document.querySelector('#'+id+' .sel');
  return b?b.dataset.v:null;
}
const peeColors={yes:'green',self:'green'};
const poopColors={yes:'yellow'};
const whoColors={'媽媽':'pink','拔拔':'green'};

function bindSeg(id,colorMap){
  document.querySelectorAll('#'+id+' button').forEach(b=>{
    b.onclick=()=>setSeg(id,b.dataset.v,colorMap);

    document.getElementById('fFood').value='';

    document.getElementById('fTopical').value='';

let albumExpanded=false;

/* 依上傳時間算週齡/月齡標籤 */
function ageLabelOf(t){
  if(!t)return '未知時間';
  const days=Math.floor((new Date(t)-BIRTH_DATE)/864e5);
  if(days<0)return '出生前';
  if(days<7)return `出生 ${days} 天`;
  if(days<70){
    const w=Math.floor(days/7);
    return `${w} 週大`;
  }
  const months=Math.floor(days/30.44);
  return `${months} 個月大`;
}

function renderPhotos(){
  const grid=document.getElementById('photoGrid');
  document.getElementById('photoCount').textContent=photos.length?photos.length+' 張':'';
  grid.innerHTML='';
  /* 移除舊的展開按鈕 */
  const oldBtn=document.getElementById('photoMoreBtn');
  if(oldBtn)oldBtn.remove();

  if(!photos.length){
    grid.innerHTML='<div class="empty" style="grid-column:1/-1;padding:14px 0">還沒有照片</div>';
    return;
  }

  const LIMIT=6;
  if(!albumExpanded&&photos.length>LIMIT){
    /* 收合模式：只顯示最新6張 */
    photos.slice(0,LIMIT).forEach(p=>grid.appendChild(makeThumb(p)));
    const btn=document.createElement('button');
    btn.id='photoMoreBtn';
    btn.className='photo-more';
    btn.textContent=`查看全部 ${photos.length} 張（依週齡分類）▾`;
    btn.onclick=()=>{albumExpanded=true;renderPhotos()};
    grid.after(btn);
  }else{
    /* 展開模式：依週齡/月齡分組 */
    const groups={};
    const order=[];
    photos.forEach(p=>{
      const lbl=ageLabelOf(p.t);
      if(!groups[lbl]){groups[lbl]=[];order.push(lbl)}
      groups[lbl].push(p);
    });
    order.forEach(lbl=>{
      const head=document.createElement('div');
      head.className='photo-section-head';
      head.style.gridColumn='1/-1';
      head.textContent=`🐾 ${lbl}`;
      grid.appendChild(head);
      groups[lbl].forEach(p=>grid.appendChild(makeThumb(p)));
    });
    if(photos.length>LIMIT){
      const btn=document.createElement('button');
      btn.id='photoMoreBtn';
      btn.className='photo-more';
      btn.textContent='收合相簿 ▴';
      btn.onclick=()=>{albumExpanded=false;renderPhotos()};
      grid.after(btn);
    }
  }
}
function makeThumb(p){
  const img=document.createElement('img');
  img.src=p.img;
  img.loading='lazy';
  img.alt='瑞瑞照片';
  img.onclick=()=>openLightbox(p.id);
  return img;
}

/* 手機照片壓縮：長邊縮到1024、JPEG品質0.65，控制在Firestore文件限制內 */
function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const MAX=1024;
        let w=img.width,h=img.height;
        if(Math.max(w,h)>MAX){
          const r=MAX/Math.max(w,h);
          w=Math.round(w*r);h=Math.round(h*r);
        }
        const cv=document.createElement('canvas');
        cv.width=w;cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        let q=0.65;
        let data=cv.toDataURL('image/jpeg',q);
        /* 若仍太大，逐步降品質（Firestore 單文件上限 1MB，base64留安全餘裕） */
        while(data.length>700000&&q>0.3){
          q-=0.1;
          data=cv.toDataURL('image/jpeg',q);
        }
        if(data.length>700000)reject(new Error('照片壓縮後仍太大'));
        else resolve(data);
      };
      img.onerror=()=>reject(new Error('無法讀取圖片'));
      img.src=reader.result;
    };
    reader.onerror=()=>reject(new Error('讀取檔案失敗'));
    reader.readAsDataURL(file);
  });
}

document.getElementById('photoInput').addEventListener('change',async ev=>{
  const files=[...ev.target.files];

  const label=document.querySelector('.photo-add');

  let ok=0;
  for(const f of files){
    try{
      const img=await compressImage(f);
      const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      const d=new Date();
      const t=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
      await setDoc(doc(db,PHOTO_COL,id),{t,img,who});
      ok++;

      toast('有照片上傳失敗：'+(e.message||''));
    }

function openLightbox(id){
  const p=photos.find(x=>x.id===id);
  if(!p)return;
  lbCurrentId=id;
  showLbPhoto(p);
  document.getElementById('lightbox').classList.add('show');
}
function showLbPhoto(p){
  document.getElementById('lbImg').src=p.img;
  const dt=p.t?new Date(p.t):null;
  document.getElementById('lbMeta').textContent=
    (dt?`${fmtDay(dt)} ${fmtTime(dt)}・${ageLabelOf(p.t)}`:'')+(p.who?`・${p.who} 上傳`:'');
  resetLbDel();
}
function lbStep(dir){
  const idx=photos.findIndex(x=>x.id===lbCurrentId);
  if(idx<0)return;
  const next=idx+dir;
  if(next<0||next>=photos.length)return;
  lbCurrentId=photos[next].id;
  showLbPhoto(photos[next]);
}
document.getElementById('lbPrev').onclick=e=>{e.stopPropagation();lbStep(-1)};
document.getElementById('lbNext').onclick=e=>{e.stopPropagation();lbStep(1)};

/* 觸控滑動切換 */
let touchX=null;
const lbEl=document.getElementById('lightbox');
lbEl.addEventListener('touchstart',e=>{touchX=e.touches[0].clientX},{passive:true});
lbEl.addEventListener('touchend',e=>{
  if(touchX==null)return;
  const dx=e.changedTouches[0].clientX-touchX;
  touchX=null;
  if(Math.abs(dx)>45)lbStep(dx>0?-1:1); /* 右滑=上一張 */
},{passive:true});
/* 鍵盤左右鍵（電腦用） */
document.addEventListener('keydown',e=>{
  if(!lbEl.classList.contains('show'))return;
  if(e.key==='ArrowLeft')lbStep(-1);
  if(e.key==='ArrowRight')lbStep(1);
  if(e.key==='Escape')closeLightbox();
});
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('show');
  lbCurrentId=null;resetLbDel();
}
function resetLbDel(){
  lbDelArmed=false;
  document.getElementById('lbDel').textContent='刪除照片';
}
document.getElementById('lbClose').onclick=closeLightbox;
document.getElementById('lightbox').addEventListener('click',e=>{
  if(e.target.id==='lightbox')closeLightbox();
});
document.getElementById('lbDel').onclick=async()=>{

/* 頭像壓縮：置中裁成正方形、縮到256px */
function compressAvatar(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const S=256;
        const side=Math.min(img.width,img.height);
        const sx=(img.width-side)/2,sy=(img.height-side)/2;
        const cv=document.createElement('canvas');
        cv.width=S;cv.height=S;
        cv.getContext('2d').drawImage(img,sx,sy,side,side,0,0,S,S);
        resolve(cv.toDataURL('image/jpeg',0.8));
      };
      img.onerror=()=>reject(new Error('無法讀取圖片'));
      img.src=reader.result;
    };
    reader.onerror=()=>reject(new Error('讀取檔案失敗'));
    reader.readAsDataURL(file);
  });
}

/* 體重圖 hover / 觸控提示：顯示最接近的資料點體重 */
(function(){
  const cv=document.getElementById('weightChart');
  const tip=document.getElementById('wTip');
  if(!cv||!tip)return;
  function show(clientX){
    if(!weightPoints.length){tip.style.display='none';return}
    const rect=cv.getBoundingClientRect();
    const x=clientX-rect.left;
    let best=weightPoints[0],bd=Infinity;
    weightPoints.forEach(p=>{const d=Math.abs(p.x-x);if(d<bd){bd=d;best=p}});
    const dt=new Date(best.t);
    tip.innerHTML=`${fmtDay(dt)} ${fmtTime(dt)}<br><b>${best.g} g</b>`;
    tip.style.display='block';
    let left=best.x-tip.offsetWidth/2;
    left=Math.max(2,Math.min(left,cv.clientWidth-tip.offsetWidth-2));
    tip.style.left=left+'px';
    tip.style.top=Math.max(2,best.y-tip.offsetHeight-10)+'px';
  }
  cv.addEventListener('pointermove',e=>show(e.clientX));
  cv.addEventListener('pointerdown',e=>show(e.clientX));
  cv.addEventListener('pointerleave',()=>tip.style.display='none');
})();
